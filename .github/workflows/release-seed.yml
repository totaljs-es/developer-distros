name: release-seed

# Publishes what people download to install Total.js Developer: the two seed images (desktop and server), a few hundred kilobytes each, with their
# checksums and a signed attestation of where they came from. The ISO of Ubuntu is NOT published here: the release says where to get the
# official one, with its checksum (docs/legal.md explains why).
# The release of a version (the tag `v*`) is published by release-iso.yml, with the ISO of Total.js Developer and these same seeds: while Canonical has not answered
# about the ISO (docs/legal.md), do not push a tag `v*`. This workflow builds only the seeds, by hand (Run workflow), and keeps them as an artifact of the run.
# With a `release_tag` it also publishes them as a release of their own, with a tag that does NOT start with `v` (for instance `seeds-0.1.0`), so that it does not start release-iso.yml.
#
# The seeds install the packages of Total.js from the address of the repository of packages, so that address has to answer BEFORE the release:
# the workflow checks it and stops if it does not.
on:
  workflow_dispatch:
    inputs:
      repository_url:
        description: Address of the repository of packages that the seeds install from
        default: https://totaljs-es.github.io/developer-distros/repo
      release_tag:
        description: "Publish the seeds as a release with this tag (for instance seeds-0.1.0; never a tag that starts with v). Empty: only an artifact of the run"
        default: ''

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPO_URL: ${{ inputs.repository_url || 'https://totaljs-es.github.io/developer-distros/repo' }}
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso gnupg

      - name: The repository of packages answers
        run: |
          for path in totaljs-developer.gpg ubuntu/dists/resolute/InRelease; do
            curl -fsSI "${REPO_URL}/${path}" >/dev/null || { echo "::error::${REPO_URL}/${path} does not answer: publish the repository first (tools/package-repo/publish-pages.sh)"; exit 1; }
            echo "ok: ${path}"
          done

      - name: Build the seed images
        run: |
          mkdir -p dist
          iso/ubuntu/build-seed.sh desktop dist/totaljs-developer-desktop-seed.iso
          iso/ubuntu/build-seed.sh server dist/totaljs-developer-server-seed.iso
          # a seed has to be what the installer expects: the label CIDATA and its two files
          for seed in dist/*.iso; do
            xorriso -indev "${seed}" -pvd_info 2>/dev/null | grep -q CIDATA || { echo "${seed} has not the label CIDATA"; exit 1; }
            xorriso -indev "${seed}" -find / -type f 2>/dev/null | sort | tr '\n' ' '; echo
          done
          (cd dist && sha256sum *.iso > SHA256SUMS && cat SHA256SUMS)

      - name: The official ISO of Ubuntu Server, for the notes of the release
        run: |
          BASE=https://releases.ubuntu.com/26.04
          curl -fsSL -o SHA256SUMS.ubuntu "${BASE}/SHA256SUMS"
          LINE="$(grep -E ' \*ubuntu-26\.04(\.[0-9]+)?-live-server-amd64\.iso$' SHA256SUMS.ubuntu | sort -k2 -V | tail -1)"
          [ -n "${LINE}" ] || { echo "the ISO of Ubuntu Server is not in the list of ${BASE}"; exit 1; }
          echo "UBUNTU_ISO=$(echo "${LINE}" | sed -E 's/^[0-9a-f]{64} \*//')" >> "${GITHUB_ENV}"
          echo "UBUNTU_SHA256=$(echo "${LINE}" | cut -d' ' -f1)" >> "${GITHUB_ENV}"
          echo "${LINE}"

      - name: Attest where they came from
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.iso

      - name: Keep them as an artifact of the run
        uses: actions/upload-artifact@v7
        with:
          name: totaljs-developer-seeds
          path: dist/
          retention-days: 14

      - name: Publish the seeds as a release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "${RELEASE_TAG}" in v*) echo "::error::a tag that starts with v starts release-iso.yml, which publishes the ISO: use another one (seeds-0.1.0)"; exit 1 ;; esac
          cat > notes.md <<NOTES
          ## Total.js Developer: seeds for the official ISO of Ubuntu Server

          Install **Total.js Developer** on Ubuntu 26.04 LTS with the **official, unmodified ISO of Ubuntu Server** and one of these seeds: a small image (a few hundred kilobytes) that tells the installer of Ubuntu what to do and downloads Total.js Developer from ${REPO_URL}.

          | Seed | For |
          | --- | --- |
          | \`totaljs-developer-desktop-seed.iso\` | Total.js Developer with an Openbox desktop |
          | \`totaljs-developer-server-seed.iso\` | Total.js Developer for the command line only |

          They are the same for Intel/AMD (amd64) and ARM (arm64) computers and virtual machines.

          ### How
          1. Download the official ISO of Ubuntu Server 26.04 LTS: \`${UBUNTU_ISO}\` (SHA-256 \`${UBUNTU_SHA256}\`) from https://releases.ubuntu.com/26.04/ for amd64, or from https://cdimage.ubuntu.com/ubuntu/releases/26.04/release/ for arm64.
          2. Download **one** seed from this page.
          3. Start the virtual machine or the computer with the Ubuntu ISO and the seed as a second drive (a second USB stick, or a second virtual drive). The installer finds it and asks for confirmation.
          4. Answer the usual questions (language, keyboard, network, disk and who you are). **It needs an internet connection** while it installs.

          The steps, for virtual machines and for real computers: https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/install.md

          Based on Ubuntu. It is not an official Ubuntu release and it is not endorsed by Canonical. Ubuntu is a trademark of Canonical Ltd.

          ### Check the download
          \`\`\`bash
          sha256sum -c SHA256SUMS --ignore-missing
          gh attestation verify totaljs-developer-desktop-seed.iso --repo ${GITHUB_REPOSITORY}
          \`\`\`
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "${RELEASE_TAG}" dist/*.iso dist/SHA256SUMS \
            --title "Total.js Developer: seeds (${RELEASE_TAG#seeds-})" --notes-file notes.md
