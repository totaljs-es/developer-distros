name: package-repo

# Builds the APT and Pacman repository with a throwaway key and uses it the way a system would: apt-get update, install, remove.
# The real repository is signed on a computer of the maintainers with the key of Total.js: that key is never in GitHub.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/package-repo/**'
      - 'packages/**'
      - '.github/workflows/package-repo.yml'

jobs:
  repo:
    # the same test on each architecture of the repository, each one native: the runner of arm64 runs the container of Ubuntu as it is, with no emulation
    name: repo (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools zstd gnupg binutils

      - name: A throwaway signing key
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-generate-key 'Throwaway Repo <test@example.com>' ed25519 sign never
          echo "TOTALJS_REPO_GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "TOTALJS_REPO_KEY=$(gpg --list-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"

      - name: Build the repository
        env:
          REPO_OUT: ${{ github.workspace }}/build/site/repo
          BASE_URL: file:///repo
        run: tools/package-repo/build.sh

      - name: What was built
        run: find build/site/repo -type f | sort

      # The layer in a clean Ubuntu 26.04 (the series of the repository): the sources, the install, what it promises, and the removal
      - name: The server layer on Ubuntu 26.04 (${{ matrix.arch }})
        run: docker run --rm -v "$PWD/build/site/repo:/repo:ro" -v "$PWD/tools/package-repo/test-install.sh:/test.sh:ro" ubuntu:26.04 bash /test.sh

      # The desktop edition: installed in the same clean Ubuntu, and its session started in a virtual screen, with screenshots
      - name: The desktop edition on Ubuntu 26.04 (${{ matrix.arch }})
        run: |
          mkdir -p build/desktop
          docker run --rm -v "$PWD/build/site/repo:/repo:ro" -v "$PWD/tools/package-repo/test-desktop.sh:/test.sh:ro" -v "$PWD/build/desktop:/out" ubuntu:26.04 bash /test.sh

      - name: Screenshots of the desktop
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-screenshots-${{ matrix.arch }}
          path: build/desktop
          if-no-files-found: ignore
