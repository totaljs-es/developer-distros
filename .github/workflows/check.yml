name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The JSON files, the catalog, the recipes and the shell syntax
      - run: node scripts/check.js


      - name: ISO plumbing regressions (no VM)
        run: python3 scripts/test-iso.py

      - name: Arch publication policy (no GitHub writes)
        run: python3 scripts/test-arch-release.py
