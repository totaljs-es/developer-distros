name: iso-ubuntu

# Builds the installable ISO of Ubuntu for amd64 from the newest LTS and proves that it installs and boots in QEMU.
# Nothing is published: it measures the size and the time, and keeps the logs.
on:
  workflow_dispatch:
  push:
    paths:
      - 'iso/**'
      - 'packages/**'
      - 'tools/package-repo/**'
      - '.github/workflows/iso-ubuntu.yml'

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso qemu-system-x86 qemu-utils gnupg

      # QEMU needs access to /dev/kvm; without it the install is emulated and very slow
      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm on this runner"

      # The control: this one is not slimmed, so if the others fail and this one does not, the cause is what was taken out
      - name: Build the ISO
        env:
          GRUB_TIMEOUT: '1'
          EXTRA_KERNEL: console=ttyS0,115200n8
          SLIM: '0'
        run: iso/ubuntu/build-iso.sh iso/ubuntu/seed-ci build/totaljs-developer-ubuntu-server-amd64.iso

      - name: Install it and boot the installed system
        run: iso/ubuntu/test-install.sh build/totaljs-developer-ubuntu-server-amd64.iso

      # The server edition for real: the ISO installs the Total.js layer from a repository, which here is built with a throwaway
      # key and served on this computer (10.0.2.2 is this computer for the guest of QEMU).
      - name: Build a repository with a throwaway key
        run: |
          sudo apt-get install -y libarchive-tools zstd binutils
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-generate-key 'Throwaway Repo <test@example.com>' ed25519 sign never
          TOTALJS_REPO_GNUPGHOME="$GNUPGHOME" \
          TOTALJS_REPO_KEY="$(gpg --list-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" \
          REPO_OUT="$PWD/build/site/repo" BASE_URL=http://10.0.2.2:8080/repo \
            tools/package-repo/build.sh
          (cd build/site && nohup python3 -m http.server 8080 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &)
          sleep 2
          curl -fsS http://127.0.0.1:8080/repo/totaljs-developer.gpg -o /dev/null

      # The ISO is slimmed taking /pool out and keeping /dists. Taking /dists out too (SLIM=all) does not install: the installer stops in
      # `apt-get update` of the target, because the CD is a source of apt and a source without its Release fails (seen in the CI).
      - name: Build the ISO that installs the layer (SLIM=pool)
        env:
          GRUB_TIMEOUT: '1'
          EXTRA_KERNEL: console=ttyS0,115200n8
          REPO_URL: http://10.0.2.2:8080/repo
          WORK_DIR: build/iso-layer-pool
          SLIM: pool
        run: iso/ubuntu/build-iso.sh iso/ubuntu/seed-ci-layer build/layer-pool-amd64.iso

      - name: Install it, boot it and look for the layer (SLIM=pool)
        id: install_pool
        continue-on-error: true   # the verdict step below fails the job, after the summary and the logs have been written
        env:
          WORK_DIR: build/iso-layer-pool
          MARKER_PATTERN: 'TOTALJS-ISO-TEST-OK node=v24\.[0-9]+\.[0-9]+ group=totaljs-developer'
        run: iso/ubuntu/test-install.sh build/layer-pool-amd64.iso

      # The way that people install, which is the one that is published: the OFFICIAL ISO of Ubuntu, as it was downloaded and checked (the ISO
      # remastered above is only for the tests), and a seed image next to it. Only the command line differs: the menu of the ISO does not
      # have `autoinstall`, so the person confirms it with "yes"; here it is on the command line.
      - name: Install the official ISO with a seed image
        id: install_official
        continue-on-error: true
        env:
          REPO_URL: http://10.0.2.2:8080/repo
          WORK_DIR: build/iso-official
          MARKER_PATTERN: 'TOTALJS-ISO-TEST-OK node=v24\.[0-9]+\.[0-9]+ group=totaljs-developer'
        run: |
          OFFICIAL="$(ls build/iso-layer-pool/ubuntu-*-live-server-amd64.iso | head -1)"
          echo "official ISO: ${OFFICIAL}"
          iso/ubuntu/build-seed.sh ci build/ci-seed.iso
          SEED_ISO=build/ci-seed.iso iso/ubuntu/test-install.sh "${OFFICIAL}"

      # The seed that people will use asks the questions that the installer asks: it is only built here, an install needs a person
      - name: Build the ISO of the server edition
        env:
          WORK_DIR: build/iso-product
        run: iso/ubuntu/build-iso.sh iso/ubuntu/seed build/totaljs-developer-ubuntu-server-amd64.iso

      # What people use: the seed images. They have to build, have the label CIDATA and the two files that the installer reads
      - name: Build the seed images
        run: |
          iso/ubuntu/build-seed.sh desktop build/totaljs-developer-desktop-seed.iso
          iso/ubuntu/build-seed.sh server build/totaljs-developer-server-seed.iso
          for seed in build/totaljs-developer-*-seed.iso; do
            xorriso -indev "${seed}" -pvd_info 2>/dev/null | grep -q CIDATA || { echo "${seed} has not the label CIDATA"; exit 1; }
            FILES="$(xorriso -indev "${seed}" -find / -type f 2>/dev/null | tr '\n' ' ')"
            case "${FILES}" in *user-data*meta-data*|*meta-data*user-data*) ;; *) echo "${seed} has ${FILES}"; exit 1 ;; esac
            echo "${seed}: ${FILES}"
          done

      - name: What was measured
        if: always()
        run: |
          {
            echo '### Ubuntu ISO (amd64)'
            ls -l build/*.iso 2>/dev/null | awk '{ printf "- %s: %.0f MiB\n", $NF, $5/1048576 }'
            [ -f build/iso/timings.txt ] && echo "- control (not slimmed): $(cat build/iso/timings.txt)"
            [ -f build/iso-layer-pool/timings.txt ] && echo "- SLIM=pool: $(cat build/iso-layer-pool/timings.txt)"
            echo "- install with SLIM=pool: ${{ steps.install_pool.outcome }}"
            [ -f build/iso-official/timings.txt ] && echo "- official ISO with a seed image: $(cat build/iso-official/timings.txt)"
            echo "- install of the official ISO with a seed image: ${{ steps.install_official.outcome }}"
            if [ -f build/iso-product/contents.txt ]; then
              echo
              echo '#### What is inside the ISO'
              echo '```'
              cat build/iso-product/contents.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The ISO that goes to a release is the one with SLIM=pool: if that install fails the job fails (the logs say why)
      - name: The slimmed ISO installs
        run: |
          echo "SLIM=pool: ${{ steps.install_pool.outcome }}"
          echo "official ISO with a seed image: ${{ steps.install_official.outcome }}"
          [ "${{ steps.install_pool.outcome }}" = success ]
          [ "${{ steps.install_official.outcome }}" = success ]

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iso-ubuntu-logs
          path: |
            build/iso/install.log
            build/iso/boot.log
            build/iso/xorriso.log
            build/iso/timings.txt
            build/iso-layer-pool/install.log
            build/iso-layer-pool/boot.log
            build/iso-layer-pool/timings.txt
            build/iso-layer-pool/contents.txt
            build/iso-official/install.log
            build/iso-official/boot.log
            build/iso-official/timings.txt
            build/iso-product/contents.txt
            ${{ runner.temp }}/http.log
