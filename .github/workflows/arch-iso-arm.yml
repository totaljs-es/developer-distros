name: arch-iso-arm

# Builds the installation ISO of Total.js Developer for Arch Linux ARM (aarch64) on the runner arm64 of GitHub (native: the chroot of ARM needs no emulation),
# and starts it in QEMU with UEFI to see that it reaches the shell with our banner. The ISO is kept as an artifact of the run: it is not published here.
on:
  workflow_dispatch:
    inputs:
      installer:
        description: Include the experimental shared Calamares installer
        type: boolean
        default: true
  push:
    paths:
      - 'arch/iso-arm/**'
      - 'arch/iso/overlay/**'
      - 'arch/install-arm.sh'
      - 'arch/calamares/**'
      - 'shared/calamares/**'
      - '.github/workflows/arch-iso-arm.yml'

jobs:
  iso:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      CALAMARES: ${{ inputs.installer && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools squashfs-tools xorriso mtools dosfstools grub-efi-arm64-bin curl qemu-system-arm qemu-efi-aarch64

      - name: Build the ISO
        run: |
          sudo env CALAMARES="$CALAMARES" KEY_FILE="$GITHUB_WORKSPACE/tools/image-builder/images/developer-ubuntu/assets/totaljs-repository.gpg" bash arch/iso-arm/build.sh

      # the build runs as root: the folder of the output, the ISO and the log go back to the runner user, so the later steps can write next to them
      # (only these: the root file system inside the folder is large and nobody else needs it)
      - name: Give the output to the runner user
        run: |
          sudo chown "$(id -u):$(id -g)" build/arch-iso-arm build/arch-iso-arm/out
          sudo chown "$(id -u):$(id -g)" build/arch-iso-arm/out/*.iso build/arch-iso-arm/mkinitcpio.log 2>/dev/null || true

      - name: The ISO, as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: totaljs-arch-arm64
          path: build/arch-iso-arm/out/totaljs-arch-arm64.iso
          retention-days: 7

      - name: The boot catalog of the ISO
        run: xorriso -indev "build/arch-iso-arm/out/totaljs-arch-arm64.iso" -report_el_torito plain 2>&1 | head -30

      # The console banner belongs to the image without the graphical installer. The image with it has no login on the serial port: its proof of life is
      # the next step (TOTALJS-CALAMARES-READY), which also needs the full system to be up.
      - name: Boot it in QEMU (UEFI)
        if: ${{ !inputs.installer }}
        env:
          ARCH: arm64
          UEFI: '1'
          QEMU_MEMORY: '3072'
          MARKER_PATTERN: 'Total\.js Developer, installation medium'
          WORK_DIR: build/arch-iso-arm/boot
          BOOT_TIMEOUT: '1500'
        run: bash iso/own/test-boot.sh "build/arch-iso-arm/out/totaljs-arch-arm64.iso"

      - name: The graphical installer loads its modules
        if: inputs.installer
        env:
          ARCH: arm64
          UEFI: '1'
          QEMU_MEMORY: '4096'
          MARKER_PATTERN: TOTALJS-CALAMARES-READY
          WORK_DIR: build/arch-iso-arm/calamares
          BOOT_TIMEOUT: '1500'
        run: bash iso/own/test-boot.sh "build/arch-iso-arm/out/totaljs-arch-arm64.iso"

      - name: Keep the boot diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arch-iso-arm-boot-logs
          path: |
            build/arch-iso-arm/boot/*
            build/arch-iso-arm/mkinitcpio.log
            build/arch-iso-arm/calamares/*
