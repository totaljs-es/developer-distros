name: arch-iso

# Builds the installation ISO of Total.js Developer for Arch (x86_64) with archiso, in a container of Arch Linux, and starts it in QEMU to see that it boots
# to the shell with our banner. The ISO is kept as an artifact of the run: it is not published here.
on:
  workflow_dispatch:
  push:
    paths:
      - 'arch/iso/**'
      - 'arch/archinstall/**'
      - '.github/workflows/arch-iso.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      options: --privileged
    timeout-minutes: 60
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed archiso git python

      - uses: actions/checkout@v7

      - name: Build the ISO
        run: |
          KEY_FILE="$GITHUB_WORKSPACE/tools/image-builder/images/developer-ubuntu/assets/totaljs-repository.gpg" bash arch/iso/build.sh

      - name: The ISO, as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: totaljs-developer-arch-x86_64-iso
          path: build/arch-iso/out/*.iso
          retention-days: 7

  boot:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: totaljs-developer-arch-x86_64-iso
          path: iso

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso

      - name: What the ISO has
        run: |
          ISO="$(ls iso/*.iso | head -n 1)"
          xorriso -indev "$ISO" -pvd_info 2>/dev/null | grep -E 'Volume Id|Publisher'
          xorriso -indev "$ISO" -find / -maxdepth 3 2>/dev/null | grep -E 'vmlinuz|initramfs|airootfs' | head

      - name: Boot it in QEMU
        run: bash arch/iso/test-boot.sh "$(ls iso/*.iso | head -n 1)"

      - name: Keep the boot diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arch-iso-boot-logs
          path: build/arch-iso/boot/*.txt

      - name: Keep the serial console
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arch-iso-boot-console
          path: build/arch-iso/boot/*.log
