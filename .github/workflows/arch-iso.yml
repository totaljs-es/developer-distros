name: arch-iso

# Builds the installation ISO of Total.js Developer for Arch (x86_64) with archiso, in a container of Arch Linux, and starts it in QEMU to see that it boots
# to the shell with our banner. The ISO is kept as an artifact of the run: it is not published here.
on:
  workflow_dispatch:
    inputs:
      installer:
        description: Include the experimental shared Calamares installer
        type: boolean
        default: true
  push:
    paths:
      - 'arch/iso/**'
      - 'arch/archinstall/**'
      - 'arch/calamares/**'
      - 'shared/calamares/**'
      - '.github/workflows/arch-iso.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      options: --privileged
    timeout-minutes: 90
    env:
      CALAMARES: ${{ inputs.installer && '1' || '0' }}
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed archiso git python

      - uses: actions/checkout@v7

      - name: Build the live installer dependencies
        if: inputs.installer
        run: |
          pacman -S --noconfirm --needed base-devel cmake ninja extra-cmake-modules qt6-base qt6-declarative qt6-svg qt6-tools yaml-cpp kcoreaddons kconfig ki18n kservice kpmcore polkit-qt6 libpwquality icu parted
          useradd --create-home --shell /bin/bash totaljs-calbuild
          mkdir -p build/arch-calamares
          chown totaljs-calbuild:totaljs-calbuild build/arch-calamares
          runuser -u totaljs-calbuild -- bash arch/calamares/build-packages.sh "$GITHUB_WORKSPACE/build/arch-calamares"

      - name: Build the ISO
        run: |
          CALAMARES_PACKAGES="$GITHUB_WORKSPACE/build/arch-calamares" KEY_FILE="$GITHUB_WORKSPACE/tools/image-builder/images/developer-ubuntu/assets/totaljs-repository.gpg" bash arch/iso/build.sh

      - name: The ISO, as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: totaljs-developer-arch-x86_64-iso
          path: build/arch-iso/out/*.iso
          retention-days: 7

  boot:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: totaljs-developer-arch-x86_64-iso
          path: iso

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso

      - name: What the ISO has
        run: |
          ISO="$(ls iso/*.iso | head -n 1)"
          xorriso -indev "$ISO" -pvd_info 2>/dev/null | grep -E 'Volume Id|Publisher'
          xorriso -indev "$ISO" -find / -maxdepth 3 2>/dev/null | grep -E 'vmlinuz|initramfs|airootfs' | head

      - name: Boot it in QEMU
        run: bash arch/iso/test-boot.sh "$(ls iso/*.iso | head -n 1)"

      - name: The graphical installer loads its modules
        if: inputs.installer
        env:
          UEFI: '1'
          QEMU_MEMORY: '4096'
          MARKER_PATTERN: TOTALJS-CALAMARES-READY
          WORK_DIR: build/arch-iso/calamares
          BOOT_TIMEOUT: '900'
        run: |
          sudo apt-get install -y ovmf
          bash iso/own/test-boot.sh "$(ls iso/*.iso | head -n 1)"

      - name: Keep the boot diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arch-iso-boot-logs
          path: build/arch-iso/boot/*.txt

      - name: Keep the serial console
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arch-iso-boot-console
          path: |
            build/arch-iso/boot/*.log
            build/arch-iso/calamares/*
