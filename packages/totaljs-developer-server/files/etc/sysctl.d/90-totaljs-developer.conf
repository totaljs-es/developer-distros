# A development server that reloads when a file changes (Total.js, a watcher, the editor in the browser) watches the files of the project, and the default limit is
# small: in a project of a medium size it ends with "ENOSPC: System limit for number of file watchers reached". These are the values that the distributions
# for developers use.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
