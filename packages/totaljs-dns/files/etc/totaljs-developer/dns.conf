# The local domain of Total.js Developer: totaljs.developer and everything under it is this computer.
#
# dnsmasq listens only on 127.0.0.100, an address of the loopback that nothing else uses (systemd-resolved owns 127.0.0.53 and 127.0.0.54, and a
# dnsmasq on 127.0.0.1 or on all the addresses races with it for the port 53). It answers the domain and nothing else: it does not read the
# DNS of the system and it does not forward.
bind-interfaces
listen-address=127.0.0.100
user=nobody
group=nogroup
no-resolv
no-poll
no-hosts
local-ttl=30
address=/totaljs.developer/127.0.0.1
