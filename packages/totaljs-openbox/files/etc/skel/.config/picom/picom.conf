# The compositor: soft shadows and fades. The autostart falls back to the xrender backend when GLX is not available
# (a machine without 3D acceleration).
backend = "glx";
vsync = true;
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -8;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Conky'",
  "_GTK_FRAME_EXTENTS@:c"
];
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;
inactive-opacity = 1.0;
frame-opacity = 1.0;
corner-radius = 0;
detect-client-opacity = true;
detect-rounded-corners = false;
use-damage = true;
