# PostgreSQL and pgAdmin. PostgreSQL is not published on the host: only the containers of the network `proxy` (the projects of Code) reach it,
# and they do not need a password. The password of pgAdmin is made when the system is installed and is in the file .env next to this one.
services:
  postgres:
    container_name: postgres
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: totaljs
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - data:/var/lib/postgresql/data
    networks:
      - default

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    restart: always
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@totaljs.developer
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?the file .env of this folder has to say PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_DISABLE_POSTFIX: 'True'
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: '1'
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: '1'
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: '1'
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT: '1'
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: '1'
      # gunicorn binds [::]:80 (IPv6) by default and nginx-proxy reaches the container over IPv4: that gives a 502
      PGADMIN_LISTEN_ADDRESS: '0.0.0.0'
      VIRTUAL_HOST: pgadmin.totaljs.developer
      VIRTUAL_PORT: '80'
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro
    networks:
      - default

volumes:
  data:
  pgadmindata:

networks:
  default:
    name: proxy
    external: true
